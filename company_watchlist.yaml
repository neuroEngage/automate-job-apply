# ─────────────────────────────────────────────────────────────────────────────
# JobRadar v2 — Company Watchlist
#
# Companies to check directly via their careers page for new openings.
# The watchlist module fetches each URL, searches for job titles matching
# any of the 6 role-priority tiers, and emits matches into the pipeline.
#
# Fields:
#   name:             Company name
#   careers_page_url: Direct URL to their careers/jobs page
#   tags:             Optional tags for categorization
#
# Cache: Checks are cached per-company. A company checked <20h ago is skipped.
# ─────────────────────────────────────────────────────────────────────────────

