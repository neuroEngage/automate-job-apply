# ─────────────────────────────────────────────────────────────────────────────
# JobRadar v2 — Funded Companies Database
#
# User-maintained, not live-scraped. Used by company_opportunity.py for
# rule-based Company Opportunity Score. No paid API calls.
#
# Fields:
#   name:        Company name (fuzzy-matched against scraped company field)
#   last_round:  Seed | Series A | Series B | Series C+ | Public | Bootstrapped
#   amount_usd:  Total funding amount in USD (approximate is fine)
#   year:        Year of last known funding round
#   tags:        Optional tags for categorization
#   size:        Optional: small (<50) | medium (50-500) | large (500+)
#
# Scoring logic:
#   - Seed = low stability, high growth-potential
#   - Series C+ / Public = high stability, moderate growth-potential
#   - Unfunded/bootstrapped = neutral (never zero)
#   - Unknown companies default to neutral midpoint (50/100)
# ─────────────────────────────────────────────────────────────────────────────

