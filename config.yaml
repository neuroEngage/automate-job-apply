# ─────────────────────────────────────────────────────────────────────────────
# Sources
# ─────────────────────────────────────────────────────────────────────────────
sources:
  # Each source now runs ONCE per tier (6 tiers) instead of 2.
  # The scraper iterates over role_priorities[].titles for each source.

  mumbai_local:
    engine: apify_linkedin             # valig/linkedin-jobs-scraper
    location: "Mumbai, Maharashtra, India"
    # Full Mumbai metro coverage — scraper uses broad location query,
    # normalizer resolves sub-region from job location string
    date_posted: "r604800"             # last 7 days; dedup catches yesterday's already
    max_results_per_title: 25
    max_charge_usd_per_call: 0.05      # hard Apify budget per call

  # v2: Pune source — mirrors mumbai_local config
  pune_local:
    engine: apify_linkedin
    location: "Pune, Maharashtra, India"
    date_posted: "r604800"
    max_results_per_title: 25
    max_charge_usd_per_call: 0.05

  india_remote:
    engine: jobspy
    sites: ["indeed", "google"]
    location: "India"
    is_remote: true
    hours_old: 168
    max_results_per_title: 30
    country_indeed: "IN"

  naukri:
    engine: apify_naukri               # epic-scrapers/naukri-scraper
    location: "Mumbai,India"
    experience_min: 0
    experience_max: 3                  # don't bother fetching >3yr listings
    max_results_per_title: 30
    max_charge_usd_per_call: 0.05

  # v2: Naukri Pune source
  naukri_pune:
    engine: apify_naukri
    location: "Pune,India"
    experience_min: 0
    experience_max: 3
    max_results_per_title: 30
    max_charge_usd_per_call: 0.05

  global_remote:
    engine: jobspy
    sites: ["indeed", "glassdoor", "google", "zip_recruiter"]
    location: "Remote"
    is_remote: true
    hours_old: 168
    max_results_per_title: 25
    country_indeed: ["USA", "UK", "Germany", "Netherlands", "Singapore", "Canada"]

# ─────────────────────────────────────────────────────────────────────────────
# v2 — 9-Component Scoring Formula
#
# All rule-based (keyword matching, TF-IDF/cosine similarity via scikit-learn).
# No LLM call required. Claude Haiku Stage B remains optional refinement only.
#
# Each component is computed on a 0–100 scale, then weighted:
# ─────────────────────────────────────────────────────────────────────────────
scoring_v2:
  # Component weights (must sum to 1.0)
  data_ai_skill_match: 0.25        # TF-IDF cosine similarity of candidate skills vs JD
  role_priority_match: 0.20        # derived from priority_tier (tier 1 = full marks)
  fresher_compatibility: 0.10      # experience gate logic, rescaled to 0–100
  ai_technology_exposure: 0.10     # AI keyword density from ai_signal_detector
  company_opportunity: 0.10        # company opportunity score from company_opportunity
  location_fit: 0.10               # region-based score
  job_freshness: 0.05              # recency score
  product_business_exposure: 0.05  # keyword hits: product, roadmap, customer, GTM, etc.
  startup_ownership_potential: 0.05 # keyword hits: founder, ownership, fast-paced, etc.

  # Role priority tier scoring (tier → score out of 100)
  tier_scores:
    1: 100
    2: 80
    3: 60
    4: 40
    5: 25
    6: 15

  # Location fit scoring (region → score out of 100)
  # Priority order: Mumbai > Navi Mumbai > Thane > Pune > India remote > global remote
  location_scores:
    mumbai_metro: 100
    navi_mumbai: 90
    thane: 80
    pune: 65
    naukri: 75          # India-local via Naukri, between Thane and Pune
    india_remote: 50
    global_remote: 30

  # Job freshness scoring (days_old → score out of 100)
  freshness_scores:
    days_0_to_3: 100
    days_4_to_7: 80
    days_8_to_14: 50
    days_15_to_30: 20
    days_over_30: 0

  # Product/Business exposure keywords
  product_business_keywords:
    - product
    - roadmap
    - customer
    - GTM
    - go-to-market
    - strategy
    - ownership
    - stakeholder
    - business impact
    - revenue

  # Startup/Ownership potential keywords
  startup_ownership_keywords:
    - founder
    - ownership
    - fast-paced
    - 0-to-1
    - 0 to 1
    - cross-functional
    - wear many hats
    - early stage
    - seed stage
    - high-growth
    - startup
    - start-up

  # Stage B (Claude Haiku) threshold — only jobs above this get LLM refinement
  stage_b_min_score: 60.0          # v2: on 0–100 scale (was 6.0 on 0–10)

  # ATS resume generation threshold
  resume_min_score: 75.0           # v2: on 0–100 scale (was 7.5 on 0–10)
  resume_max_per_day: 5            # HARD CAP — not configurable without editing this line

# ── Legacy scoring keys (kept for backward compat, unused by v2 scorer) ─────
scoring:
  skill_weight: 0.35
  exp_weight: 0.25
  comp_weight: 0.25
  recency_bonus:
    days_0_to_3: 2.0
    days_4_to_7: 1.5
    days_8_to_14: 0.75
    days_15_to_30: 0.25
    days_over_30: 0.0
  region_bonus:
    mumbai: 1.5
    india_remote: 0.75
    naukri: 1.0
    global_remote: 0.0
  tier2_skill_multiplier: 0.85
  tier2_flat_penalty: 0.5
  stage_b_min_score: 6.0
  resume_min_score: 7.5
  resume_max_per_day: 5

# ─────────────────────────────────────────────────────────────────────────────
# Company page validation
# ─────────────────────────────────────────────────────────────────────────────
validation:
  enabled: true
  # Run validation for all jobs where overall_score >= this threshold
  min_score_to_validate: 50.0      # v2: on 0–100 scale (was 5.0 on 0–10)
  # Timeout per company page HTTP request (seconds)
  request_timeout_sec: 10
  # If validation fails (no careers page found / request error), keep job but flag it
  on_failure: "flag"              # "flag" | "exclude"
  # Mark a job as "stale" if its listing URL returns 404 or title not found on careers page
  stale_label: "⚠️ Possibly Stale"
  # User-agent for career page requests (polite scraping)
  user_agent: "Mozilla/5.0 (JobRadar validation bot; contact: nageshkhichade00@gmail.com)"

# ─────────────────────────────────────────────────────────────────────────────
# Budget guard
# ─────────────────────────────────────────────────────────────────────────────
budget:
  monthly_ceiling_usd: 10.00      # HARD CAP — $10/month max total spend
  # When ceiling hit: skip Stage B + resume gen, keep free scraping + Stage A
  degraded_mode_label: "budget_cap_hit"

# ─────────────────────────────────────────────────────────────────────────────
# Google Sheets
# ─────────────────────────────────────────────────────────────────────────────
sheets:
  # Tab names (change here if you rename tabs in the Sheet)
  job_tracker_tab: "Job Tracker"
  seen_jobs_tab: "SeenJobs"
  archive_tab: "Archive"
  reach_roles_tab: "Reach Roles (5yr+)"
  run_log_tab: "Run Log"
  weekly_quota_tab: "Weekly Quota"
  # Archive jobs older than this many days (with no re-sighting)
  archive_after_days: 30

# ─────────────────────────────────────────────────────────────────────────────
# Weekly Quota Tracker (v2)
#
# Tracks Applied jobs by priority tier over trailing 7 days against target
# allocation. Configurable per-tier percentages.
# ─────────────────────────────────────────────────────────────────────────────
weekly_quota:
  enabled: true
  allocation:
    tier_1: 0.40    # 40% Priority 1 (Data Engineering)
    tier_2: 0.30    # 30% Priority 2 (Analytics)
    tier_3: 0.20    # 20% Priority 3 (Core AI/ML)
    tiers_4_5_6: 0.10  # 10% Priorities 4–6 combined

# ─────────────────────────────────────────────────────────────────────────────
# Company Watchlist (v2)
# ─────────────────────────────────────────────────────────────────────────────
company_watchlist:
  enabled: true
  config_file: "company_watchlist.yaml"
  cache_file: ".watchlist_cache.json"
  min_check_interval_hours: 20     # skip company if checked < this many hours ago
  request_timeout_sec: 10

# ─────────────────────────────────────────────────────────────────────────────
# Daily Digest (v2)
#
# Sends a categorized daily digest (10 sections) via email or webhook.
# Fully optional — run continues if no delivery mechanism configured.
# ─────────────────────────────────────────────────────────────────────────────
digest:
  enabled: true
  # Set NOTIFY_EMAIL env var or WEBHOOK_URL secret to enable delivery
  # If neither is set, digest is composed but not sent (logged only)
  max_jobs_per_section: 10         # cap per category section to keep digest readable

# ─────────────────────────────────────────────────────────────────────────────
# Claude model selection
# ─────────────────────────────────────────────────────────────────────────────
llm:
  scoring_model: "claude-haiku-4-5"   # cheapest — repetitive classification task
  resume_model: "claude-haiku-4-5"    # capped at 5/day anyway; Haiku sufficient
  max_jds_per_batch: 10               # Stage B batch size
  max_jd_chars: 4000                  # truncation limit per JD (cost control)
